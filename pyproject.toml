[project]
name = "tome"
version = "0.0.1"
description = "Enterprise knowledge assistant: grounded answers with citations over company documents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sahand Atlasi" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# ---------- Ruff: formatter + linter ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplify: needlessly complex code
    "N",       # pep8-naming
    "RUF",     # ruff-specific rules
]

# ---------- mypy: static type checking ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# ---------- pytest + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=tome --cov-report=term-missing"
markers = [
    "live: calls the real Gemini API; needs GEMINI_API_KEY (deselect with -m 'not live')",
]

[tool.coverage.report]
fail_under = 80
skip_covered = true
